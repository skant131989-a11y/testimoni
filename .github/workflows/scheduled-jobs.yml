# Scheduled jobs: every recurring email/maintenance job calls its own endpoint
# on the live site. They used to be Vercel crons (Hobby plan: once a day, and
# it limited what we could add); they live here now.
#
# Setup (repo -> Settings -> Secrets and variables -> Actions):
#   CRON_SECRET  required. The same value as CRON_SECRET on Vercel.
#   APP_URL      optional. Defaults to https://testimoni.io.
#
# Times are UTC. GitHub can start a scheduled run a few minutes late when it is
# busy, which is fine for these. To run one now: Actions -> Scheduled jobs ->
# Run workflow, and give the path (for example /api/cron/lifecycle?dryRun=1).
#
# The prospect finder (/api/cron/find-prospects) is NOT scheduled here: it does not finish inside
# Vercel's 60-second limit (it timed out three times in a test), and it spends search credits.
# The laptop task "Testimoni find prospects 0930" runs it instead.
#
# Logs are not given the response body on purpose: some jobs return email
# addresses, and workflow logs may be public. Only the HTTP status is shown.

name: Scheduled jobs

on:
  schedule:
    - cron: "37 2 * * 1"    # Mon   wall-score-weekly   weekly Wall Score email
    - cron: "45 3 * * *"    # daily testimonial-requests  reminders + due request emails
    - cron: "0 4 * * *"     # daily lifecycle           day-3 / day-7 onboarding emails
    - cron: "15 1 * * *"    # daily expire-grants       end finished trials and grants
    - cron: "30 14 * * *"   # daily daily-outreach      prospect emails (8:00 PM IST)
    - cron: "0 16 * * 1"    # Mon   weekly-mentions     new-praise emails, batch 1
    - cron: "20 16 * * 1"   # Mon   weekly-mentions     new-praise emails, batch 2
    - cron: "30 6 * * *"    # daily watch-recheck       "we found more" notify-me emails
    - cron: "45 4 * * *"    # daily trial-emails        day-10 / day-13 trial reminders
    - cron: "30 5 * * *"    # daily inbox-reminders     testimonials waiting 24h+ for approval
    - cron: "30 3 * * 1"    # Mon   wall-digest         weekly wall views / new testimonials note
  workflow_dispatch:
    inputs:
      path:
        description: "Endpoint to call, e.g. /api/cron/lifecycle?dryRun=1"
        required: false
        type: string
      schedule:
        description: "Or: pretend this cron string fired, to test the schedule mapping (e.g. 15 1 * * *)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cron-${{ github.event.schedule || github.event.inputs.schedule || github.event.inputs.path || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Call the job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          SCHEDULE: ${{ github.event.schedule || github.event.inputs.schedule }}
          INPUT_PATH: ${{ github.event.inputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Add the CRON_SECRET repository secret (same value as on Vercel)."
            exit 1
          fi

          if [ -n "${INPUT_PATH:-}" ]; then
            P="$INPUT_PATH"
          else
            case "$SCHEDULE" in
              "37 2 * * 1")   P="/api/cron/wall-score-weekly" ;;
              "45 3 * * *")   P="/api/cron/testimonial-requests" ;;
              "0 4 * * *")    P="/api/cron/lifecycle" ;;
              "15 1 * * *")   P="/api/cron/expire-grants" ;;
              "30 14 * * *")  P="/api/cron/daily-outreach" ;;
              "0 16 * * 1")   P="/api/cron/weekly-mentions" ;;
              "20 16 * * 1")  P="/api/cron/weekly-mentions" ;;
              "30 6 * * *")   P="/api/cron/watch-recheck" ;;
              "45 4 * * *")   P="/api/cron/trial-emails" ;;
              "30 5 * * *")   P="/api/cron/inbox-reminders" ;;
              "30 3 * * 1")   P="/api/cron/wall-digest" ;;
              *) echo "::error::No job is mapped to schedule '$SCHEDULE'."; exit 1 ;;
            esac
          fi

          case "$P" in /api/cron/*) ;; *) echo "::error::Only /api/cron/* paths can be called."; exit 1 ;; esac

          BASE="${APP_URL:-https://testimoni.io}"
          echo "Calling ${P%%\?*} on ${BASE}"
          # The response can contain email addresses, so it is never printed. It is
          # saved, and only counts and the send switch are shown below.
          CODE=$(curl -sS -o /tmp/body.json -w "%{http_code}" --max-time 150 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${BASE}${P}")
          echo "HTTP ${CODE}"
          jq -c '{ok, dryRun, note, error, dailyLimit, sentToday, processed, sent, queueLeft, owners, week,
            actions: ((.report // []) | map(.action // empty) | group_by(.) | map({(.[0]): length}) | add),
            outreach_sent: (if .results then ([.results[] | select(.sent == true)] | length) else null end)}
            | with_entries(select(.value != null))' /tmp/body.json 2>/dev/null || echo "(no summary in this response)"
          case "$CODE" in 2*) ;; *) echo "::error::${P%%\?*} returned HTTP ${CODE}"; exit 1 ;; esac
